# erlang/gleam/just exact pins live in .tool-versions (asdf-compatible; also
# read by trellis doctor). This file adds the tools .tool-versions can't
# express: backend-prefixed installs and env.
[tools]
node = "24"
"github:tylerbutler/trellis" = "0.11.2"
"github:tylerbutler/licence_audit" = { version = "0.8.0", asset_pattern = "licence_audit", bin = "licence_audit" }

[env]
LC_ALL = "en_US.UTF-8"
