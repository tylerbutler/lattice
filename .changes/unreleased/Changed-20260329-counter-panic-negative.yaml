kind: Changed
body: |-
    Counter `increment` and `decrement` now panic on negative deltas

    `g_counter.increment`, `pn_counter.increment`, and `pn_counter.decrement`
    now crash if called with a negative delta. Previously, negative deltas
    were silently applied, violating the grow-only invariant and producing
    incorrect merge results. Use the new `try_increment` / `try_decrement`
    functions if you need to validate deltas at runtime without crashing.
