project: lattice_text
kind: Breaking
body: |-
  Remove the redundant `try_*` mutators

  Dropped `try_insert`, `try_delete`, `try_move`, `try_delete_range`, and
  `try_replace_range`. These safe, delta-less variants only discarded the delta
  produced by their `try_*_with_delta` counterparts, so they added surface
  without behaviour. Callers that need a `Result` should use the matching
  `try_*_with_delta` function and ignore the delta element. The panicking
  `insert`, `delete`, `move`, `delete_range`, and `replace_range` variants are
  unchanged, and their doc comments now state that they panic on invalid
  indices or ranges.
