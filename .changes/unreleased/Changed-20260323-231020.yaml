kind: Changed
body: |-
    Make LWW Map equal-timestamp merge resolution deterministic

    `lww_map.merge` now uses a deterministic tie-breaker when timestamps are
    equal: tombstones win over active values, and between two active values
    the lexicographically greater one is chosen. This guarantees
    commutativity (`merge(a, b) == merge(b, a)`) in all cases. Previously,
    equal-timestamp merges could return different results depending on
    argument order.

    `lww_register.merge` retains the 1.0.0 behavior where the second
    argument wins on equal timestamps. A fully commutative tie-breaker for
    the generic register is planned for a future major version.
