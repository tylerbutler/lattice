kind: Added
body: |-
    New `crdt.matches_spec` public function
    Returns `True` when a wrapped `Crdt` value matches the expected `CrdtSpec`
    variant. Useful for validating that heterogeneous CRDT values conform to a
    declared schema before merging or persisting.
