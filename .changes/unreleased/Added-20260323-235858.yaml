kind: Added
body: |-
    Add `prune` and `tombstone_count` to LWWMap

    `prune(map, stable_timestamp)` removes tombstone entries at or below the
    given timestamp, preventing unbounded growth from repeated deletions.
    `tombstone_count(map)` returns the number of tombstoned entries for
    monitoring. Both are non-breaking additions.

    The caller must ensure all replicas have synced past `stable_timestamp`
    before pruning; a zombie-safe version with type-level tracking is planned
    for v2 (see https://github.com/tylerbutler/lattice/issues/18).
