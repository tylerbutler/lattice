kind: Added
body: |-
    Add tombstone pruning to ORSet and ORMap

    `or_set.prune(orset, stable_vv)` removes tombstones dominated by the
    given stable version vector and records the pruned frontier so that
    subsequent merges can detect and discard zombie tags. `or_map.prune`
    delegates to the internal ORSet key tracker.

    **Safety:** `stable_vv` must represent a causal cut that all replicas
    have already observed. Pruning with a version vector that is ahead of any
    replica can cause previously removed elements to reappear.
