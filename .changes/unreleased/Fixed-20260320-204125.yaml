body: |-
    CRDT correctness fixes
    Improved LWW tie-breaking to be deterministic and commutative. Enforced non-negative deltas in `GCounter.increment` and `PNCounter.increment`/`decrement` (panics on violation). Preserved OR-Set tombstones across merges to prevent stale replicas from resurrecting removed elements. Tightened ORMap spec and type validation during `update` and `merge`.
