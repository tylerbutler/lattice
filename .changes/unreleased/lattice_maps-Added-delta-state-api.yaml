project: lattice_maps
kind: Added
body: |-
  Add delta-state API to ORMap

  New opaque `ORMapDelta` type plus `or_map.update_with_delta`, `remove_with_delta`, `apply_delta`, `merge_deltas`, `empty_delta`, `delta_to_json`, and `delta_from_json`. Mutations return a small delta carrying only the touched keys, the OR-Set key-set delta, and per-value CRDT deltas — much smaller than full-state messages for sync over unreliable transports such as websockets. `apply_delta` validates `crdt_spec` and merges idempotently and commutatively. Also adds `crdt.default_delta` and `crdt.is_empty_delta` helpers in the dispatch module. Existing `update` and `remove` are unchanged and now delegate to the delta versions internally.
time: 2026-05-09T16:13:04.752065852+00:00
