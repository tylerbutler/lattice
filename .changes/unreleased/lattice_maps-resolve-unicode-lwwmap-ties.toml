package = "lattice_maps"
kind = "Fixed"
body = """
Resolve Unicode LWWMap ties the same way on both targets

Equal-timestamp live values now use UTF-8 byte order, preserving the previous Erlang winner and fixing JavaScript disagreement for values such as U+E000 and U+10000. Timestamp and tombstone precedence are unchanged. Upgrade peers together; previously discarded values cannot be recovered."""
