package = "lattice_presence"
kind = "Added"
body = """
Add supersede for caller-selected incarnation cleanup

Use `presence_state.supersede` to remove other known incarnations of the selected base and receive one combined leave diff while retaining causal high-water marks. The function returns `Result` and rejects attempts to retire the local writer with `CannotSupersedeLocalReplica`; callers must establish the current incarnation through their membership protocol."""
