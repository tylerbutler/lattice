kind: Added
body: |-
    Add `try_increment` and `try_decrement` for safe counter updates

    `g_counter.try_increment` and `pn_counter.try_increment` /
    `pn_counter.try_decrement` return `Result` values, returning
    `Error(NegativeDelta(n))` when passed a negative delta. The existing
    `increment` / `decrement` functions are unchanged.
