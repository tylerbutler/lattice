kind: Fixed
body: |-
    Validate type and version in per-type JSON decoders

    `lww_register.from_json`, `or_set.from_json`, and `or_map.from_json` now
    check the `"type"` and `"v"` envelope fields before decoding state,
    returning a clear `DecodeError` on mismatch. Previously, passing a valid
    JSON envelope for the wrong CRDT type could silently produce corrupt
    state. Existing OR-Set v1 payloads (without tombstones) remain
    backward-compatible.
time: 2026-03-23T23:10:23.682797-07:00
