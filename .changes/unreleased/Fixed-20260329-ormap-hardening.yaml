kind: Fixed
body: |-
    Eliminate panics in OR-Map merge, update, and decode paths

    `or_map.merge` previously called `panic` when the two sides contained
    different CRDT types for the same key. It now falls back to a fresh
    default value matching the map's spec. `or_map.update` validates that the
    callback's return value matches the map's CRDT spec and ignores the
    update if it does not. `or_map.from_json` rejects values that do not
    match the declared spec with a `DecodeError` instead of silently
    accepting them.
time: 2026-03-29T10:03:00.000000-07:00
