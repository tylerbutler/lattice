kind: Fixed
body: |-
    Prevent removed elements from reappearing after OR-Set and OR-Map merge

    Merging an OR-Set with a stale replica could resurrect elements that had
    already been removed. OR-Set now tracks tombstones for removed tags and
    filters them during merge, preserving add-wins / observed-remove semantics.
    OR-Map inherits this fix for its internal key set.
