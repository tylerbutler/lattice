name: "Setup Environment"
description: "Install the toolchain via mise (cached) with monorepo-aware Gleam dependency caching"

runs:
  using: "composite"
  steps:
    # Installs everything from .tool-versions + .mise.toml in one cached step:
    # erlang (precompiled on ubuntu runners), gleam, just, node, trellis.
    - name: Install tools with mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # ratchet:jdx/mise-action@v4.2.0
      env:
        # The github: backend (trellis) queries the GitHub API for releases;
        # authenticated requests avoid the anonymous rate limit.
        GITHUB_TOKEN: ${{ github.token }}
      with:
        version: 2026.7.5

    - name: Cache Gleam dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
      with:
        path: |
          build/packages
          ~/.cache/gleam
        # Hash all package manifests so the cache invalidates when any package
        # adds, removes, or changes a dependency.
        key: gleam-${{ runner.os }}-${{ hashFiles('packages/*/gleam.toml', 'packages/*/manifest.toml') }}
        restore-keys: gleam-${{ runner.os }}-
