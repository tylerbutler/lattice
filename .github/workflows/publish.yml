name: Publish

on:
  push:
    tags: ['lattice_*-v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Publish to Hex.pm
        uses: tylerbutler/actions/gleam-publish@36da049e8e49a6abaf6fd59106e7f9e2a6b27e5f # ratchet:tylerbutler/actions/gleam-publish@main
        with:
          packages: >-
            packages/lattice_core
            packages/lattice_counters
            packages/lattice_sets
            packages/lattice_registers
            packages/lattice_maps
            packages/lattice_crdt
          hex-api-key: ${{ secrets.HEXPM_API_KEY }}
