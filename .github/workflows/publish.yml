name: Publish

# Broad tag pattern so new packages added to workspace.toml are automatically
# publishable without editing this workflow. The workspace reader maps the tag
# to a known package path before validation or publish runs.
on:
  push:
    tags:
      - '*-v*'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      package-path: ${{ steps.ws.outputs.tag-package-path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Read workspace
        id: ws
        uses: tylerbutler/actions/read-gleam-workspace@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/read-gleam-workspace@main
        with:
          tag: ${{ github.ref_name }}

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node: "true"

      - name: Validate tagged package
        env:
          PACKAGE: ${{ steps.ws.outputs.tag-package-path }}
        run: |
          cd "$PACKAGE"
          gleam deps download
          gleam format --check src test
          gleam check
          gleam build --warnings-as-errors
          gleam test
          gleam test --target javascript
          gleam docs build

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      # Publish only the package named by the pushed tag.
      # replace-path-deps rewrites path dependencies to Hex version ranges
      # derived from each package's gleam.toml before publishing.
      - name: Publish to Hex.pm
        uses: tylerbutler/actions/gleam-publish@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/gleam-publish@main
        with:
          packages: ${{ needs.test.outputs.package-path }}
          replace-path-deps: |
            lattice_core:packages/lattice_core/gleam.toml
            lattice_counters:packages/lattice_counters/gleam.toml
            lattice_registers:packages/lattice_registers/gleam.toml
            lattice_sets:packages/lattice_sets/gleam.toml
            lattice_maps:packages/lattice_maps/gleam.toml
            lattice_sequence:packages/lattice_sequence/gleam.toml
            lattice_text_core:packages/lattice_text_core/gleam.toml
            lattice_text:packages/lattice_text/gleam.toml
            lattice_fugue:packages/lattice_fugue/gleam.toml
          hex-api-key: ${{ secrets.HEXPM_API_KEY }}

  # After publishing, update manifest.toml lockfiles so they reflect the
  # latest published versions. This keeps the repo in sync with Hex.
  update-lockfiles:
    needs: publish
    runs-on: ubuntu-latest
    # Lockfile refresh is a best-effort convenience: it hits the Hex API for
    # every package right after publish and can trip Hex rate limits. A failure
    # here must not mark the Publish run as failed, otherwise downstream
    # automation (e.g. auto-tag waiting on this workflow) aborts the rest of
    # the release even though the package was published successfully.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Refresh lockfiles
        run: |
          for pkg_dir in packages/lattice_*/; do
            if [ -f "$pkg_dir/gleam.toml" ]; then
              echo "Refreshing $pkg_dir manifest..."
              (cd "$pkg_dir" && gleam deps download)
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- '*.toml'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Lockfile changes detected:"
            git diff --stat -- '*.toml'
          fi

      - name: Create lockfile update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          BRANCH="chore/update-lockfiles-${TAG}"
          git checkout -b "$BRANCH"
          git add -A '*.toml'
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update lockfiles after ${TAG} publish"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update lockfiles after ${TAG} publish" \
            --body "Auto-generated PR to refresh \`manifest.toml\` lockfiles after publishing \`${TAG}\`." \
            --base main \
            --head "$BRANCH"
