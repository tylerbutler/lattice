name: Changie Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Read workspace
        id: ws
        uses: tylerbutler/actions/read-gleam-workspace@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/read-gleam-workspace@main

      - name: Setup environment
        uses: ./.github/actions/setup

      - uses: tylerbutler/actions/changie-release@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/changie-release@main
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          pr-title-template: 'chore(release): {version}'
          projects: ${{ steps.ws.outputs.projects }}
          version-files: |
            ${{ steps.ws.outputs.version-files }}
          post-batch-command: |
            echo "Refreshing lockfiles after version bumps..."

            # Patch the locked version of each bumped local package directly in every
            # manifest.toml that references it, instead of running `gleam update`.
            # `gleam update` re-resolves the *entire* dependency graph against Hex even
            # for a purely local path-dependency bump, and one such call per package
            # reliably trips Hex's per-IP rate limit on shared GitHub runners once a
            # release batches more than a couple of packages. A local path package's
            # "version" in manifest.toml is just recorded metadata — writing it
            # directly produces the exact same result with zero network calls, so this
            # scales to any batch size.
            changed_projects=$(git diff --name-only -- 'packages/*/gleam.toml' \
              | sed -E 's#^packages/(lattice_[a-z_]+)/gleam\.toml$#\1#')
            echo "Bumped projects: $(echo "$changed_projects" | tr '\n' ' ')"

            for dep in $changed_projects; do
              new_version=$(grep -m1 '^version = ' "packages/$dep/gleam.toml" | cut -d'"' -f2)
              for manifest in packages/*/manifest.toml examples/manifest.toml; do
                [ -f "$manifest" ] || continue
                grep -q "{ name = \"$dep\", version = " "$manifest" || continue
                sed -i -E "s/(\{ name = \"$dep\", version = \")[^\"]*(\")/\1${new_version}\2/" "$manifest"
                echo "Updated $manifest: $dep -> $new_version"
              done
            done

      - name: Summary
        if: steps.release.outputs.skipped != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PR_URL: ${{ steps.release.outputs.pr-url }}
          PR_OP: ${{ steps.release.outputs.pr-operation }}
          BATCHED: ${{ steps.release.outputs.batched-projects }}
        run: |
          echo "### Release PR Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Versions:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Batched projects:** $BATCHED" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR:** $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Operation:** $PR_OP" >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped
        if: steps.release.outputs.skipped == 'true'
        run: |
          echo "### Release Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No unreleased change fragments found." >> "$GITHUB_STEP_SUMMARY"
