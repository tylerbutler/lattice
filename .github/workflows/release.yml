name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Batches unreleased changelog fragments into per-package version bumps
      # (gleam.toml + CHANGELOG.md + lockfile patches, zero Hex calls), pushes
      # the release/pending branch, and creates or updates the release PR.
      # A no-op when there are no unreleased fragments.
      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: trellis release pr --base main
