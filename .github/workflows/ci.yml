name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  format:
    name: Format
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      format-check: true

  check:
    name: Check
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      check: true

  lint:
    name: Lint
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      run-deps: true
      build-strict: false
      custom-command: gleam run -m glinter

  lint-examples:
    name: Lint (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/setup-gleam@main
        with:
          working-directory: examples

      - name: Lint examples (glinter)
        run: cd examples && gleam run -m glinter

  build:
    name: Build
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true

  test:
    name: Test
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      run-deps: true
      test: true

  test-js:
    name: Test (JavaScript)
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      run-deps: true
      test-js: true

  docs:
    name: Docs
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@c3de10f5c576265f4910698528d949179081f25b # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      build-strict: false
      docs: true
