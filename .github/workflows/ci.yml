name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      HEXPM_API_KEY:
        description: Hex API key for dependency resolution and downloads
        required: false

env:
  HEXPM_READ_API_KEY: ${{ secrets.HEXPM_API_KEY }}

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download dependencies with pacing
        run: trellis exec --serial -- sh -c 'gleam deps download && sleep 5'

  doctor:
    name: Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: trellis doctor

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: trellis run format --check

  workspace-validation:
    name: Workspace validation
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check
        run: trellis run check
      - name: Lint
        run: trellis run lint
      - name: Build
        run: trellis run build --strict --target all
      - name: Test
        run: trellis run test
      - name: Test (JavaScript)
        run: trellis run test --target javascript
      - name: Docs
        run: trellis run docs --serial

  licence-audit:
    name: Licence audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: just licence-audit
