name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  format:
    name: Format
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      format-check: true

  check:
    name: Check
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      check: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gleam dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5
        with:
          path: |
            packages/*/build/packages
            examples/build/packages
            ~/.cache/gleam
          key: gleam-lint-${{ runner.os }}-${{ hashFiles('**/gleam.toml', '**/manifest.toml') }}
          restore-keys: |
            gleam-lint-${{ runner.os }}-

      - name: Setup environment
        uses: tylerbutler/actions/setup-gleam@v1

      - name: Download dependencies
        run: just deps

      - name: Lint (glinter)
        run: just lint

  build:
    name: Build
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true

  test:
    name: Test
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      run-deps: true
      test: true

  test-js:
    name: Test (JavaScript)
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      run-deps: true
      test-js: true

  docs:
    name: Docs
    uses: tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@d67948fe17fa338034eb7cff2ef51779992438a3 # ratchet:tylerbutler/actions/.github/workflows/gleam-workspace-ci.yml@main
    with:
      cache: true
      build-strict: false
      docs: true
