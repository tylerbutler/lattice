name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-erlang:
    runs-on: ubuntu-latest
    name: Test (Erlang)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Check formatting
        run: just format-check

      - name: Type check
        run: just check

      - name: Build (warnings as errors)
        run: just build-strict

      - name: Run tests
        run: just test

      - name: Build examples
        run: just examples-build

      - name: Run examples
        run: just examples-run

  test-js:
    runs-on: ubuntu-latest
    name: Test (JavaScript)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node: 'true'

      - name: Build (warnings as errors)
        run: just build-strict-js

      - name: Run tests
        run: just test-js

      - name: Build examples (JavaScript)
        run: just examples-build-js

      - name: Run examples (JavaScript)
        run: just examples-run-js

  docs:
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build documentation
        run: just docs
