# Workspace root — config-only manifest marking the trellis workspace.
# Membership, the dependency graph, topological order, and release wiring are
# all derived from packages/*/gleam.toml by trellis; nothing is listed twice.
# See https://github.com/tylerbutler/trellis

[tools.trellis]
# examples participates in format/lint/build/test, but not docs.
exclude = { docs = ["examples"] }

[tools.trellis.tasks.lint]
command = "gleam run -m glinter"
needs_deps = true

[tools.trellis.publish]
exact_tag_format = "{name}-v{version}"
path_dep_requirement = "minor"
retry = { attempts = 5, initial_delay = "30s", multiplier = 2 }

[tools.trellis.publish.lifecycle.packages]
"packages/lattice_fugue" = "workspace"
"packages/lattice_text_fugue" = "workspace"
"examples" = "workspace"

[tools.trellis.changelog]
strictness = "warn"
header_format = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."""
change_format = "#### {{ body }}"
# Bump semantics carried over from the retired .changie.yaml: Changed and
# Removed are patch bumps here, unlike trellis's defaults.
kinds = [
  { label = "Major Release", bump = "major" },
  { label = "Breaking", bump = "major" },
  { label = "Added", bump = "minor" },
  { label = "Changed", bump = "patch" },
  { label = "Deprecated", bump = "patch" },
  { label = "Fixed", bump = "patch" },
  { label = "Performance", bump = "patch" },
  { label = "Removed", bump = "patch" },
  { label = "Reverted", bump = "patch" },
  { label = "Dependencies", bump = "patch" },
  { label = "Security", bump = "patch" },
]

[tools.licence_audit]
allow = ["Apache-2.0", "MIT"]
