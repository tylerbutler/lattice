changesDir: .changes
unreleasedDir: unreleased
headerPath: header.md
changelogPath: CHANGELOG.md
versionHeaderPath: ""
versionFooterPath: ""
versionExt: md
envPrefix: CHANGIE
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: |-
    #### {{(splitn "\n" 2 .Body)._0}}
    {{with (splitn "\n" 2 .Body)._1 | default "" | trim}}
    {{.}}
    {{end}}
body:
    block: true
    minLength: 1
kinds:
    - label: Breaking
      auto: major
    - label: Added
      auto: minor
    - label: Changed
      auto: patch
    - label: Deprecated
      auto: patch
    - label: Fixed
      auto: patch
    - label: Performance
      auto: patch
    - label: Removed
      auto: patch
    - label: Reverted
      auto: patch
    - label: Dependencies
      auto: patch
    - label: Security
      auto: patch
projectsVersionSeparator: "-"
newlines:
    afterChangelogHeader: 1
    afterChangelogVersion: 1
    afterKind: 1
    afterVersion: 1
    beforeKind: 1
    endOfVersion: 1
projects:
    - label: Core
      key: lattice_core
      changelog: packages/lattice_core/CHANGELOG.md
      replacements:
          - path: packages/lattice_core/gleam.toml
            find: 'version = ".*"'
            replace: 'version = "{{.VersionNoPrefix}}"'
    - label: Counters
      key: lattice_counters
      changelog: packages/lattice_counters/CHANGELOG.md
